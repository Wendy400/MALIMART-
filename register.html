<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page-Malimart</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <form>
        <!--legend is like a heading used in forms, caption is for tables-->
        <legend>Join us today!</legend>
        <br>
        <label for="fullname">Fullname: </label>
        <input type="text" id="fullname" placeholder="eg Mark Doe" required>
        <br><br>

        <label for="email">Email Address: </label>
        <input type="text" id="email" placeholder="eg markdoe@gmail.com" required>
        <br><br>


        <label for="pwd">Password: </label>
        <input type="password" id="pwd" placeholder="Type your password" required>
        <br><br>

        <label for="Phone">Phone No: </label>
        <input type="tel" id="phone" placeholder="eg 0712345678" required>
        <br><br>

        <label for="date">Birth date: </label>
        <input type="date" id="dob" required>
        <br><br>

        <label for="dt">Date and Time: </label>
        <input type="datetime-local" id="dt" required>
        <br><br>

        <label for="upload">Upload file: </label>
        <input type="file" id="upload" required>
        <br><br>

<!--Dropdown-->
<!--radio button-->
<!--checkbox-->
<!--text area-->
       
    <button>Register</button>




    </form>

    
</body>
</html>
